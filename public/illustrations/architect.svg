<svg width="200" height="100" viewBox="0 0 200 100" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Drafting Compass -->
  <line x1="50" y1="17" x2="50" y2="21" stroke="#083D33" stroke-width="1.5" stroke-linecap="round"/>
  <circle cx="50" cy="25" r="4" fill="none" stroke="#083D33" stroke-width="1.5"/>
  
  <!-- Needle Leg -->
  <line x1="47" y1="28" x2="35" y2="65" stroke="#083D33" stroke-width="1.5" stroke-linecap="round"/>
  <polygon points="33,65 37,65 35,72" fill="#083D33"/>
  
  <!-- Pencil Leg -->
  <line x1="53" y1="28" x2="65" y2="58" stroke="#083D33" stroke-width="1.5" stroke-linecap="round"/>
  <polygon points="63,58 68,57 69,63 64,64" fill="#E8F7F0" stroke="#083D33" stroke-width="1.5" stroke-linejoin="round"/>
  <polygon points="64,64 69,63 67,72" fill="none" stroke="#083D33" stroke-width="1.5" stroke-linejoin="round"/>
  <polygon points="65,68 68,67 67,72" fill="#083D33"/>
  
  <!-- Compass Crossbar -->
  <line x1="42" y1="45" x2="59" y2="45" stroke="#083D33" stroke-width="1.5" stroke-linecap="round"/>
  
  <!-- Drawing Arc -->
  <path d="M67 72 A 32 32 0 0 0 45 44" fill="none" stroke="#083D33" stroke-width="1.5" stroke-dasharray="3 3"/>
  
  <!-- Dashed curve connecting to concept -->
  <path d="M75 40 Q 95 30, 115 45" fill="none" stroke="#083D33" stroke-width="1.5" stroke-dasharray="3 3"/>

  <!-- Architecture Building Concept -->
  <!-- Floating Block -->
  <!-- Top Face -->
  <polygon points="140,14 132,18 140,22 148,18" fill="#E8F7F0" stroke="#083D33" stroke-width="1.5" stroke-linejoin="round"/>
  <!-- Left Face -->
  <polygon points="132,18 132,26 140,30 140,22" fill="none" stroke="#083D33" stroke-width="1.5" stroke-linejoin="round"/>
  <!-- Right Face -->
  <polygon points="140,22 140,30 148,26 148,18" fill="none" stroke="#083D33" stroke-width="1.5" stroke-linejoin="round"/>
  
  <!-- Drop Lines indicating placement -->
  <line x1="132" y1="29" x2="126" y2="40" stroke="#083D33" stroke-width="1.5" stroke-dasharray="2 2"/>
  <line x1="148" y1="29" x2="154" y2="40" stroke="#083D33" stroke-width="1.5" stroke-dasharray="2 2"/>
  <line x1="140" y1="33" x2="140" y2="48" stroke="#083D33" stroke-width="1.5" stroke-dasharray="2 2"/>

  <!-- Base Cube -->
  <!-- Top Face -->
  <polygon points="140,34 124,42 140,50 156,42" fill="none" stroke="#083D33" stroke-width="1.5" stroke-linejoin="round"/>
  <!-- Left Face -->
  <polygon points="124,42 124,62 140,70 140,50" fill="none" stroke="#083D33" stroke-width="1.5" stroke-linejoin="round"/>
  <!-- Right Face -->
  <polygon points="140,50 140,70 156,62 156,42" fill="none" stroke="#083D33" stroke-width="1.5" stroke-linejoin="round"/>
  
  <!-- Sparkles -->
  <line x1="165" y1="25" x2="170" y2="20" stroke="#083D33" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="172" y1="35" x2="177" y2="33" stroke="#083D33" stroke-width="1.5" stroke-linecap="round"/>

<svg width="200" height="100" viewBox="0 0 200 100" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Checklist board -->
  <rect x="70" y="20" width="50" height="60" rx="4" fill="none" stroke="#083D33" stroke-width="1.5"/>
  <!-- Spirals -->
  <path d="M80 15 C75 10, 85 10, 80 25" fill="none" stroke="#083D33" stroke-width="1.5"/>
  <path d="M95 15 C90 10, 100 10, 95 25" fill="none" stroke="#083D33" stroke-width="1.5"/>
  <path d="M110 15 C105 10, 115 10, 110 25" fill="none" stroke="#083D33" stroke-width="1.5"/>
  <!-- Lines -->
  <line x1="80" y1="35" x2="110" y2="35" stroke="#083D33" stroke-width="1.5"/>
  <line x1="80" y1="45" x2="105" y2="45" stroke="#083D33" stroke-width="1.5"/>
  <line x1="80" y1="55" x2="110" y2="55" stroke="#083D33" stroke-width="1.5"/>
  <!-- Big checkmark in circle -->
  <circle cx="115" cy="60" r="16" fill="#E8F7F0" stroke="#083D33" stroke-width="1.5"/>
  <polyline points="108,60 113,65 122,53" fill="none" stroke="#083D33" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Sparkles -->
  <line x1="125" y1="35" x2="130" y2="30" stroke="#083D33" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="135" y1="45" x2="142" y2="42" stroke="#083D33" stroke-width="1.5" stroke-linecap="round"/>
</svg>
